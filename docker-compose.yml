services:
  # Backend Flask Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocery_backend
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=grocery_user
      - MYSQL_PASSWORD=grocery_password
      - MYSQL_DATABASE=grocery_db
      - AEROSPIKE_HOST=aerospike
      - AEROSPIKE_PORT=3000
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
      aerospike:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/debug"]
      timeout: 20s
      retries: 10
      start_period: 30s

  # Frontend Next.js Application
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: grocery_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    ports:
      - "4000:4000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      timeout: 20s
      retries: 10
      start_period: 30s
  mysql:
    image: mysql:8.0
    container_name: grocery_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grocery_db
      MYSQL_USER: grocery_user
      MYSQL_PASSWORD: grocery_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  aerospike:
    image: aerospike/aerospike-server-enterprise:8.1
    container_name: grocery_aerospike
    environment:
      NAMESPACE: grocery
      REPLICATION_FACTOR: 1
      MEM_GB: 1
      DEFAULT_TTL: 0
      FEATURE_KEY_FILE: /etc/aerospike/features.conf
    ports:
      - "3000:3000"
    volumes:
      - aerospike_data:/opt/aerospike/data
      - ./aerospike.conf:/etc/aerospike/aerospike.conf
    restart: unless-stopped
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "asadm", "-e", "info"]
      timeout: 20s
      retries: 10
  aerospike-tools:
    image: aerospike/aerospike-tools:latest
    container_name: grocery_aerospike_tools
    depends_on:
      - aerospike
    environment:
      - AEROSPIKE_HOST=aerospike
      - AEROSPIKE_PORT=3000
    entrypoint: [ "tail", "-f", "/dev/null" ]
    networks:
      - grocery_network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: grocery_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: grocery
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
  aerospike_data:
  mongodb_data:
  mongodb_config:

networks:
  grocery_network:
    driver: bridge